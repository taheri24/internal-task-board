name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskboard" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://taskboard:taskboard@localhost:5432/taskboard
      JWT_SECRET: ci-only-secret-value-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend lint, build, test
        working-directory: backend
        run: |
          npm run lint
          npm run build
          npm test
      - name: Migrate and seed
        working-directory: backend
        run: |
          npm run migration:run
          npm run seed
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
